<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTA - Own The Night</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0d0d0d;
    color: white;
}
header {
    text-align: center;
    padding: 60px 20px;
    background: black;
}
h1 {
    font-size: 50px;
    letter-spacing: 6px;
}
button {
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
.shop-btn {
    background: white;
    color: black;
}
.section {
    padding: 40px 20px;
    text-align: center;
}
.products {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}
.product {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 8px;
    width: 220px;
}
.product img {
    width: 100%;
    border-radius: 6px;
}
.cart {
    position: fixed;
    top: 10px;
    right: 10px;
    background: black;
    padding: 10px;
    border-radius: 5px;
}
footer {
    text-align: center;
    padding: 20px;
    background: black;
}
    .logo {
  display: block;
  margin: 40px auto;
  width: 220px;
}
</style>
</head>
<body>

<div class="cart">
🛒 Carrito: <span id="cart-count">0</span>
</div>

<header>
<img src="logo.png" alt="VANTA Logo" class="logo">
<p>Own The Night</p>
<button class="shop-btn">SHOP NOW</button>
</header>

<div class="section">
<h2>Productos</h2>

<div class="products">

<div class="product">
<img src="https://via.placeholder.com/220" alt="Hoodie">
<h3>Hoodie Black</h3>
<p>$25.000</p>
<button onclick="addToCart()">Agregar</button>
<a href="https://www.mercadopago.com.ar/" target="_blank">
<button class="shop-btn">Comprar</button>
</a>
</div>

<div class="product">
<img src="https://via.placeholder.com/220" alt="Remera">
<h3>Oversized Tee</h3>
<p>$15.000</p>
<button onclick="addToCart()">Agregar</button>
<a href="https://www.mercadopago.com.ar/" target="_blank">
<button class="shop-btn">Comprar</button>
</a>
</div>

</div>
</div>

<footer>
© 2026 VANTA - Streetwear Argentina
</footer>

<script>
let count = 0;
function addToCart() {
    count++;
    document.getElementById("cart-count").innerText = count;
}
</script>

</body>
</html>
